# Tests and the type check on every push and pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # the build tools, the type checker, and the published 1.0.0 and 1.0.1 the tests hold every build against
      - name: Install dev dependencies (pinned by package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Tests (includes the check that web/lib is what the build makes from src)
        run: node --test test/*.test.ts
      - name: Type check (includes the check that the types match src)
        run: npx tsc -p tsconfig.json
