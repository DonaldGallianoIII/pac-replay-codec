<svg xmlns="http://www.w3.org/2000/svg" width="820" height="516" viewBox="0 0 820 516" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" role="img" aria-labelledby="t d">
<title id="t">How many times smaller than the raw replay, by compressor</title>
<desc id="d">gzip -6 2.67x, zstd -3 3x, zstd -8 3.15x, zstd -8 + dictionary 3.16x, brotli 5 3.49x, zstd -19 3.59x, zstd -22 3.59x, zstd -19 + 1 MB dictionary 3.67x, brotli 11 4x, xz -6 4.01x, split by field + zstd -19 4.75x, split, deltas + zstd -19 5.26x, this codec 11.24x. Ratio = raw size / packed size. Generic rows: 70 replays, 3,611 KB raw per game on average. Codec row: 10 other replays, 3.4 MB each. Source tables are in the README.</desc>
